<!DOCTYPE html>
<html>
<head>
    <title>Radial Menu Simple Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #222;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #4a90e2;
        }
        svg {
            border: 2px solid #444;
            background: #111;
            margin: 20px 0;
            width: 100%;
            max-width: 600px;
            height: 400px;
        }
        .info {
            background: #1b1b1b;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid #4a90e2;
            border-radius: 4px;
        }
        .console {
            background: #0a0a0a;
            color: #0f0;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
        }
        .console div {
            margin: 3px 0;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
        }
        button:hover {
            background: #5aa0f2;
        }
        .status-ok { color: #90EE90; }
        .status-err { color: #ff6b6b; }
        .status-info { color: #87CEEB; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Radial Menu Simple Test</h1>
        
        <div class="info">
            <strong>Instructions:</strong>
            <ol>
                <li>Click "Create Test SVG" to set up test environment</li>
                <li>Click "Initialize Menu" to create the radial menu</li>
                <li>Click on the circle (red dot) to show the menu</li>
                <li>Watch console output below</li>
            </ol>
        </div>

        <div>
            <button onclick="createTestSvg()">1. Create Test SVG</button>
            <button onclick="initializeMenu()">2. Initialize Menu</button>
            <button onclick="showTestMenu()">3. Show Menu (Test)</button>
            <button onclick="clearConsoleOutput()">Clear Console</button>
        </div>

        <svg id="test-svg"></svg>

        <h3>Console Output:</h3>
        <div class="console" id="console-output"></div>
    </div>

    <script>
        // Setup SVG namespace
        const SVG_NS = 'http://www.w3.org/2000/svg';
        
        // Store SVG reference
        let testSvg = null;
        let radialMenu = null;
        
        // Console capture
        function logToConsole(message, type = 'info') {
            const console = document.getElementById('console-output');
            const color = type === 'error' ? '#ff6b6b' : type === 'warn' ? '#ffd93d' : '#0f0';
            const line = document.createElement('div');
            line.style.color = color;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.appendChild(line);
            console.scrollTop = console.scrollHeight;
        }
        
        // Override console.log for this test
        const originalLog = window.console.log;
        const originalError = window.console.error;
        
        window.console.log = function(...args) {
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            logToConsole(msg, 'info');
            originalLog.apply(window.console, args);
        };
        
        window.console.error = function(...args) {
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
            logToConsole(msg, 'error');
            originalError.apply(window.console, args);
        };
        
        function clearConsoleOutput() {
            document.getElementById('console-output').innerHTML = '';
        }
        
        // Step 1: Create test SVG with clickable circle
        function createTestSvg() {
            testSvg = document.getElementById('test-svg');
            testSvg.setAttribute('width', '600');
            testSvg.setAttribute('height', '400');
            
            // Background
            const bg = document.createElementNS(SVG_NS, 'rect');
            bg.setAttribute('width', '600');
            bg.setAttribute('height', '400');
            bg.setAttribute('fill', '#111');
            testSvg.appendChild(bg);
            
            // Clickable circle (test unit)
            const circle = document.createElementNS(SVG_NS, 'circle');
            circle.setAttribute('cx', '300');
            circle.setAttribute('cy', '200');
            circle.setAttribute('r', '20');
            circle.setAttribute('fill', '#ff0000');
            circle.setAttribute('id', 'test-unit');
            circle.style.cursor = 'pointer';
            circle.addEventListener('click', (e) => {
                e.stopPropagation();
                console.log('[TEST] Circle clicked!');
            });
            testSvg.appendChild(circle);
            
            // Add click handler to SVG
            testSvg.addEventListener('click', (e) => {
                console.log('[TEST] SVG clicked, target:', e.target.id || e.target.tagName);
            });
            
            console.log('✓ Test SVG created at 300,200 (click the red dot)');
            logToConsole('SVG created. Ready for menu initialization.', 'info');
        }
        
        // Step 2: Initialize radial menu (simplified version)
        function initializeMenu() {
            if (!testSvg) {
                console.error('✗ SVG not created yet! Click "Create Test SVG" first.');
                logToConsole('ERROR: SVG not created. Run step 1 first.', 'error');
                return;
            }
            
            console.log('[MENU] Initializing menu...');
            
            // Create menu group
            const menuGroup = document.createElementNS(SVG_NS, 'g');
            menuGroup.setAttribute('id', 'radial-menu');
            menuGroup.setAttribute('class', 'radial-menu-group');
            testSvg.appendChild(menuGroup);
            
            // Store reference
            radialMenu = {
                menuGroup,
                svg: testSvg,
                show(x, y) {
                    this.menuGroup.innerHTML = '';
                    
                    const items = [
                        { type: 'Hold', angle: 0, color: '#4CAF50' },
                        { type: 'Advance', angle: 72, color: '#2196F3' },
                        { type: 'Support', angle: 144, color: '#FF9800' },
                        { type: 'Transform', angle: 216, color: '#9C27B0' },
                        { type: 'Convoy', angle: 288, color: '#F44336' },
                    ];
                    
                    console.log('[MENU] Rendering menu at', x, y);
                    
                    // Render each menu item
                    items.forEach((item, i) => {
                        const rad = (item.angle - 90) * Math.PI / 180;
                        const itemX = x + Math.cos(rad) * 80;
                        const itemY = y + Math.sin(rad) * 80;
                        
                        const group = document.createElementNS(SVG_NS, 'g');
                        
                        const circle = document.createElementNS(SVG_NS, 'circle');
                        circle.setAttribute('cx', itemX);
                        circle.setAttribute('cy', itemY);
                        circle.setAttribute('r', '25');
                        circle.setAttribute('fill', item.color);
                        circle.setAttribute('stroke', '#fff');
                        circle.setAttribute('stroke-width', '2');
                        circle.style.cursor = 'pointer';
                        
                        circle.addEventListener('click', (e) => {
                            e.stopPropagation();
                            console.log('[MENU] Item clicked:', item.type);
                            logToConsole(`Menu item clicked: ${item.type}`, 'info');
                        });
                        
                        circle.addEventListener('mouseenter', () => {
                            circle.setAttribute('r', '28');
                            circle.setAttribute('stroke-width', '4');
                        });
                        
                        circle.addEventListener('mouseleave', () => {
                            circle.setAttribute('r', '25');
                            circle.setAttribute('stroke-width', '2');
                        });
                        
                        group.appendChild(circle);
                        
                        const text = document.createElementNS(SVG_NS, 'text');
                        text.setAttribute('x', itemX);
                        text.setAttribute('y', itemY);
                        text.setAttribute('text-anchor', 'middle');
                        text.setAttribute('dominant-baseline', 'middle');
                        text.setAttribute('fill', '#fff');
                        text.setAttribute('font-size', '14');
                        text.setAttribute('pointer-events', 'none');
                        text.textContent = item.type;
                        group.appendChild(text);
                        
                        this.menuGroup.appendChild(group);
                    });
                    
                    // Center circle
                    const center = document.createElementNS(SVG_NS, 'circle');
                    center.setAttribute('cx', x);
                    center.setAttribute('cy', y);
                    center.setAttribute('r', '10');
                    center.setAttribute('fill', '#555');
                    this.menuGroup.appendChild(center);
                    
                    console.log('[MENU] Rendered', items.length, 'items');
                    logToConsole(`Menu rendered with ${items.length} items`, 'info');
                }
            };
            
            console.log('✓ Menu initialized');
            logToConsole('Menu initialized. Ready to display.', 'info');
        }
        
        // Step 3: Show test menu
        function showTestMenu() {
            if (!radialMenu) {
                console.error('✗ Menu not initialized! Click "Initialize Menu" first.');
                logToConsole('ERROR: Menu not initialized. Run step 2 first.', 'error');
                return;
            }
            
            console.log('[TEST] Showing menu at 300,200');
            radialMenu.show(300, 200);
            logToConsole('Menu displayed. Try hovering and clicking items.', 'info');
        }
        
        // Auto-log on load
        window.addEventListener('load', () => {
            logToConsole('Test page loaded. Follow steps 1-3.', 'info');
        });
    </script>
</body>
</html>
