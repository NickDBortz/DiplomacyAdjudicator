name: Run Tests

# Triggers the workflow on every push to any branch
on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code onto the runner
    - name: Check out repository
      uses: actions/checkout@v4

    # Step 2: Install and configure Python on the runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    # Step 3: Install Pytest
    - name: Install Pytest
      run: pip install pytest
        
    # Step 3: Run test script
    - name: Run Tests
      run: pytest -m pytest