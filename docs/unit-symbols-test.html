<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Army and Fleet Symbol Test</title>
    <style>
        body {
            background-color: #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .symbol-container {
            text-align: center;
        }
        
        svg {
            width: 200px;
            height: 200px;
            border: 2px solid #ccc;
            background-color: #111;
        }
        
        h2 {
            color: white;
            margin-top: 20px;
        }
        
        .legend {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        
        .color-sample {
            text-align: center;
        }
        
        .color-box {
            width: 50px;
            height: 50px;
            margin: 0 auto 10px;
            border: 2px solid #ccc;
        }
        
        .color-text {
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <p style="color:white">This page shows the earlier icon design. View the current <a href="army.svg">army</a> and <a href="fleet.svg">fleet</a> SVGs.</p>
    <div class="symbol-container">
        <h2>Army Unit</h2>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <defs>
                <style>
                    svg { --army-color: #4169E1; }
                </style>
            </defs>
            <path d="M 50 15 L 75 30 L 75 55 Q 50 75 50 75 Q 25 75 25 55 L 25 30 Z" 
                  fill="#4169E1" stroke="none"/>
            <path d="M 50 15 L 75 30 L 75 55 Q 50 75 50 75 Q 25 75 25 55 L 25 30 Z" 
                  fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
            <line x1="50" y1="25" x2="50" y2="65" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="38" y1="40" x2="62" y2="40" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="50" cy="68" r="2.5" fill="#fff"/>
        </svg>
        <p style="color: white; margin-top: 10px;">Shield with cross sword icon</p>
    </div>

    <div class="symbol-container">
        <h2>Fleet Unit</h2>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
            <path d="M 35 35 L 45 28 L 55 28 L 65 35 L 62 50 L 38 50 Z" 
                  fill="#D22B2B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
            <line x1="50" y1="28" x2="50" y2="55" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <polygon points="50,32 58,48 50,48" fill="#fff" opacity="0.7"/>
            <circle cx="50" cy="65" r="2.5" fill="#fff"/>
            <line x1="47" y1="67" x2="53" y2="67" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M 47 67 Q 45 72 48 75" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M 53 67 Q 55 72 52 75" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="50" y1="67" x2="50" y2="72" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p style="color: white; margin-top: 10px;">Ship hull with anchor icon</p>
    </div>

    <div class="symbol-container">
        <h2>Different Colors</h2>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
            <!-- Army in Blue -->
            <g transform="translate(30, 50)">
                <path d="M 50 15 L 75 30 L 75 55 Q 50 75 50 75 Q 25 75 25 55 L 25 30 Z" 
                      fill="#4169E1" stroke="none"/>
                <path d="M 50 15 L 75 30 L 75 55 Q 50 75 50 75 Q 25 75 25 55 L 25 30 Z" 
                      fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
                <line x1="50" y1="25" x2="50" y2="65" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="38" y1="40" x2="62" y2="40" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="50" cy="68" r="2.5" fill="#fff"/>
            </g>
            <!-- Fleet in Red -->
            <g transform="translate(150, 50)">
                <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
                <path d="M 35 35 L 45 28 L 55 28 L 65 35 L 62 50 L 38 50 Z" 
                      fill="#D22B2B" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
                <line x1="50" y1="28" x2="50" y2="55" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                <polygon points="50,32 58,48 50,48" fill="#fff" opacity="0.7"/>
                <circle cx="50" cy="65" r="2.5" fill="#fff"/>
                <line x1="47" y1="67" x2="53" y2="67" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M 47 67 Q 45 72 48 75" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M 53 67 Q 55 72 52 75" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="50" y1="67" x2="50" y2="72" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            </g>
        </svg>
        <p style="color: white; margin-top: 10px;">Army (Blue) and Fleet (Red)</p>
    </div>
</body>
</html>
