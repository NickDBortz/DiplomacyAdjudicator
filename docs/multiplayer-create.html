<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Diplomacy - Host a Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <div class="menu-content">
      <h1>Diplomacy</h1>
      <p class="section-header">Host a Game</p>
      <input id="host-name" class="menu-input" type="text" placeholder="Your name" maxlength="24">
      <input id="host-game-name" class="menu-input" type="text" placeholder="Your game name" maxlength="24">
      <button id="host-create" class="btn">Create Game</button>
      <button id="host-back" class="btn btn-secondary">Back</button>
      <p id="menu-message" class="menu-message"></p>
    </div>
  </div>
  <script src="multiplayer-create.js"></script>
</body>
</html>
