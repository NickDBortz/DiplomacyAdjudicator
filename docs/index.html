<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Diplomacy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading-popup" class="loading-overlay">
    <div class="loading-content">
      <div class="spinner"></div>
      <p>Loading, please wait...</p>
    </div>
  </div>
  <div id="menu" class="menu-with-disclaimer">
    <div id="disclaimer" class="disclaimer">
      <h3>Disclaimer:</h3>
      <p>This is an unofficial fan-made project and is not affiliated with, endorsed by, or sponsored by Hasbro, Wizards of the Coast, or any rights holder of the Diplomacy trademark.</p>
    </div>
    <div class="menu-content">
      <h1>Diplomacy Adjudicator</h1>

      <div id="menu-main" class="menu-view">
        <button id="menu-rejoin" class="btn hidden">Rejoin Game</button>
        <button id="menu-singleplayer" class="btn">Singleplayer</button>
        <button id="menu-multiplayer" class="btn">Multiplayer</button>
      </div>

      <div id="menu-multi" class="menu-view hidden">
        <p class="section-header">Multiplayer</p>
        <button id="menu-host" class="btn">Host a Game</button>
        <button id="menu-join" class="btn">Join a Game</button>
        <button id="menu-back" class="btn btn-secondary">Back</button>
      </div>
    </div>
  </div>
  <script src="shared.js"></script>
  <script src="menu.js"></script>
</body>
</html>
